<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThreatTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="ShieldOps logo">
      <div>
        <p class="brand-name">ThreatTalk</p>
        <p class="brand-tagline">Reimagining of cybersecurity through intelligent, adaptive conversation.</p>
      </div>
    </a>

    <nav class="site-nav" aria-label="Main">
      <a class="nav-link" href="#about">About Us</a>
      <button class="nav-icon" type="button" aria-label="Leaderboard">🏆</button>
      <button class="nav-icon" type="button" aria-label="Language">🌐</button>
      <div class="streak">
        <button class="nav-icon" type="button" aria-label="Daily streak">🔥</button>
        <span class="chip">keep streak?</span>
      </div>
      <span class="nav-gap" aria-hidden="true"></span>
      <button class="chip" type="button" aria-disabled="true" tabindex="-1">Learn</button>
      <button class="chip" type="button" aria-disabled="true" tabindex="-1">Quiz</button>
      <button class="chip" type="button" aria-disabled="true" tabindex="-1">Profile</button>
    </nav>
  </header>

  <main>
    <section class="welcome-card" aria-labelledby="welcome-title">
      <img class="welcome-logo" src="logo.png" alt="ShieldOps shield logo">
      <h1 class="welcome-title" id="welcome-title">Welcome to ThreatTalk</h1>
      <p class="welcome-actions">
        <a href="login.html">Log in</a> or <a href="signup.html">Sign up</a>
      </p>
    </section>
  </main>

</body>
</html>
