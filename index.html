<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThreatTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #8a8a8a;
      --faint: #c4c4c4;
      --line: #e6e6e6;
      --chip-bg: #f4f4f4;
      --card-bg: #d9d9d9;
      --link: #1f2350;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Header ---------- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 45px;
      padding: 0 12px 0 2px;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      color: inherit;
      text-decoration: none;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex: none;
      display: block;
    }

    .brand-name {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.25;
    }

    .brand-tagline {
      margin: 1px 0 0;
      font-size: 9.5px;
      line-height: 1.3;
      color: var(--muted);
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: none;
    }

    .nav-link {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      margin-right: 1px;
    }
    .nav-link:hover { color: var(--text); }

    .nav-icon {
      font-size: 19px;
      line-height: 1;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    .chip {
      font: inherit;
      font-size: 10.5px;
      color: var(--faint);
      background: var(--chip-bg);
      border: 0;
      border-radius: 4px;
      padding: 4px 12px;
      line-height: 1.2;
    }

    .chip[aria-disabled="true"] { cursor: default; }

    .streak {
      display: flex;
      align-items: center;
      gap: 1px;
    }
    .streak .chip {
      padding: 2px 3px;
      margin-left: 1px;
    }

    .nav-gap { width: 13px; }

    /* ---------- Login card ---------- */
    main {
      display: flex;
      justify-content: center;
      padding: 132px 16px 48px;
    }

    .welcome-card {
      width: 100%;
      max-width: 539px;
      min-height: 177px;
      padding: 13px 24px 50px;
      background: var(--card-bg);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .welcome-logo {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      display: block;
    }

    .welcome-title {
      margin: 6px 0 0;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.005em;
    }

    .welcome-actions {
      margin: 1px 0 0;
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }

    .welcome-actions a {
      color: var(--link);
      font-weight: 600;
      text-decoration: none;
    }
    .welcome-actions a:hover { text-decoration: underline; }

    a:focus-visible, button:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---------- Small screens ---------- */
    @media (max-width: 760px) {
      .site-header { flex-wrap: wrap; padding: 8px 12px; }
      .site-nav { flex-wrap: wrap; gap: 8px; }
      .nav-gap { display: none; }
      .brand-tagline { display: none; }
      main { padding-top: 56px; }
    }
  </style>
</head>
