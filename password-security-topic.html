<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Security · ThreatTalk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="logo.png" alt="ShieldOps logo">
      <div>
        <p class="brand-name">ThreatTalk</p>
        <p class="brand-tagline">Reimagining of cybersecurity through intelligent, adaptive conversation.</p>
      </div>
    </a>

    <nav class="site-nav" aria-label="Main">
      <a class="nav-link nav-link--active" href="#about">About Us</a>
      <button class="nav-icon" type="button" aria-label="Leaderboard">🏆</button>
      <button class="nav-icon" type="button" aria-label="Language">🌐</button>
      <div class="streak">
        <button class="nav-icon" type="button" aria-label="Daily streak">🔥</button>
        <span class="chip">keep streak?</span>
      </div>
      <span class="nav-gap" aria-hidden="true"></span>
      <button class="chip chip--active" type="button">Learn</button>
      <button class="chip chip--active" type="button">Quiz</button>
      <div class="profile-menu">
        <button class="chip chip--active" type="button" id="profile-button" aria-haspopup="true" aria-expanded="false">Profile</button>
        <div class="profile-dropdown" id="profile-dropdown" hidden>
          <button class="profile-dropdown-item" type="button" id="logout-button">Log out</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="chat-shell">
    <div class="chat-topbar">
      <a class="chat-back-btn" href="password-security.html">&larr; Topics</a>
      <h1 class="chat-topic-title" id="chat-topic-title">Password Security</h1>
      <!--<button class="chat-complete-btn" type="button" id="complete-button">Mark complete</button>-->
    </div>

    <div class="chat-thread" id="chat-thread" aria-live="polite">
      <!-- Messages are inserted by lesson-chat.js -->
    </div>

    <form class="chat-composer" id="chat-composer">
      <input type="text" id="chat-input" placeholder="Ask about phishing, passwords, data security, or any security topic …" autocomplete="off">
    </form>
  </main>

  <script src="dashboard.js"></script>
  <script src="lesson-chat.js"></script>
</body>
</html>
